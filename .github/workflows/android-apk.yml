name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "android-native/**"
      - "public/**"
      - "index.html"
      - "package.json"
      - "capacitor.config.json"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: npm install

      - name: Build web app
        run: npm run build

      - name: Generate Android project
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Install native Android browser
        run: |
          APP_JAVA=android/app/src/main/java/com/bostrading/ytmanager
          mkdir -p "$APP_JAVA"
          cp android-native/MainActivity.java "$APP_JAVA/MainActivity.java"
          cp android-native/YtmBrowserPlugin.java "$APP_JAVA/YtmBrowserPlugin.java"
          cp android-native/YtmBrowserActivity.java "$APP_JAVA/YtmBrowserActivity.java"
          python3 - <<'PY'
          from pathlib import Path
          manifest = Path("android/app/src/main/AndroidManifest.xml")
          content = manifest.read_text()
          activity = '''
                  <activity
                      android:name=".YtmBrowserActivity"
                      android:exported="false"
                      android:configChanges="keyboard|keyboardHidden|orientation|screenSize|smallestScreenSize"
                      android:windowSoftInputMode="adjustResize"
                      android:theme="@android:style/Theme.Material.Light.NoActionBar" />
          '''
          if ".YtmBrowserActivity" not in content:
              content = content.replace("</application>", activity + "\n    </application>")
              manifest.write_text(content)
          PY

      - name: Restore stable Android signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: yt-manager-android-debug-signing-v1

      - name: Create signing key if missing
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -v \\
              -keystore ~/.android/debug.keystore \\
              -storepass android \\
              -keypass android \\
              -alias androiddebugkey \\
              -keyalg RSA -keysize 2048 -validity 10000 \\
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: YT-Manager-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
